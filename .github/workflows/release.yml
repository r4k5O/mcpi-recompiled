name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x86-64
            artifact: release-linux-x86_64
          - os: windows-latest
            name: Windows x86-64
            artifact: release-windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install SDL Linux window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev

      - name: Install Python MCPI client
        run: python -m pip install mcpi==1.2.1

      - name: Configure
        run: cmake -S . -B build -DMCPI_BUILD_TESTS=ON -DMCPI_BUILD_CLIENT=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Linux x86-64
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          package="mcpi-recompiled-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir -p "dist/${package}"
          cp build/mcpi-recompiled "dist/${package}/mcpi-recompiled"
          cp README.md "dist/${package}/README.md"
          chmod +x "dist/${package}/mcpi-recompiled"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          rm -rf "dist/${package}"

      - name: Package Windows x86-64
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = "mcpi-recompiled-$env:GITHUB_REF_NAME-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist/$package" | Out-Null
          Copy-Item "build/Release/mcpi-recompiled.exe" "dist/$package/mcpi-recompiled.exe"
          Copy-Item "README.md" "dist/$package/README.md"
          Compress-Archive -Path "dist/$package/*" -DestinationPath "dist/$package.zip" -CompressionLevel Optimal
          Remove-Item -Recurse -Force "dist/$package"

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        shell: bash
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/mcpi-recompiled-${{ github.ref_name }}-linux-x86_64.tar.gz
            release-assets/mcpi-recompiled-${{ github.ref_name }}-windows-x86_64.zip
            release-assets/SHA256SUMS.txt
