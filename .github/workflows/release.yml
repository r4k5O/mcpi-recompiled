name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: Custom version, for example 0.2.5 or v0.2.5 (used only with custom)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mcpi-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      source_sha: ${{ steps.version.outputs.source_sha }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Resolve release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          source_sha="$(git rev-parse HEAD)"

          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="$PUSH_TAG"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tags must use vMAJOR.MINOR.PATCH, got: $tag" >&2
              exit 1
            fi
            echo "Resolved release tag: $tag"
          else
            echo "Requested release type: $RELEASE_TYPE"
            echo "Requested custom version: ${CUSTOM_VERSION:-<empty>}"

            if [[ -n "$CUSTOM_VERSION" ]]; then
              RELEASE_TYPE="custom"
            fi
            echo "Effective release type: $RELEASE_TYPE"

            git fetch --tags --force
            mapfile -t release_tags < <(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname)
            latest="${release_tags[0]:-v0.0.0}"

            if [[ ! "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Could not parse latest semantic version tag: $latest" >&2
              exit 1
            fi

            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"

            case "$RELEASE_TYPE" in
              patch)
                patch=$((patch + 1))
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              custom)
                custom="${CUSTOM_VERSION#v}"
                if [[ ! "$custom" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  echo "Custom version must be MAJOR.MINOR.PATCH (optionally prefixed with v)." >&2
                  exit 1
                fi

                latest_plain="${latest#v}"
                highest="$(printf '%s\n%s\n' "$latest_plain" "$custom" | sort -V | tail -n1)"
                if [[ "$highest" != "$custom" || "$custom" == "$latest_plain" ]]; then
                  echo "Custom version v$custom must be newer than latest release $latest." >&2
                  exit 1
                fi

                IFS=. read -r major minor patch <<< "$custom"
                ;;
              *)
                echo "Unsupported release type: $RELEASE_TYPE" >&2
                exit 1
                ;;
            esac

            tag="v${major}.${minor}.${patch}"
            echo "Resolved release tag: $tag"

            if [[ -n "$CUSTOM_VERSION" ]]; then
              expected_custom="v${CUSTOM_VERSION#v}"
              if [[ "$tag" != "$expected_custom" ]]; then
                echo "Custom release mismatch: requested $expected_custom but resolved $tag" >&2
                exit 1
              fi
            fi

            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "Tag already exists: $tag" >&2
              exit 1
            fi
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"
          echo "Release source: $source_sha"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x86-64
            artifact: release-linux-x86_64
            package_suffix: linux-x86_64
          - os: windows-latest
            name: Windows x86-64
            artifact: release-windows-x86_64
            package_suffix: windows-x86_64
          - os: macos-latest
            name: macOS ARM64
            artifact: release-macos-arm64
            package_suffix: macos-arm64
          - os: macos-15-intel
            name: macOS x86-64
            artifact: release-macos-x86_64
            package_suffix: macos-x86_64

    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install SDL Linux window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev

      - name: Install Python MCPI client
        run: python -m pip install mcpi==1.2.1

      - name: Configure
        run: cmake -S . -B build -DMCPI_BUILD_TESTS=ON -DMCPI_BUILD_CLIENT=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Unix native client
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          package="mcpi-recompiled-${RELEASE_TAG}-${{ matrix.package_suffix }}"
          mkdir -p "dist/${package}"
          cp build/mcpi-recompiled "dist/${package}/mcpi-recompiled"
          cp README.md LICENSE NOTICE LEGAL.md "dist/${package}/"
          chmod +x "dist/${package}/mcpi-recompiled"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          rm -rf "dist/${package}"

      - name: Package Windows native client
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = "mcpi-recompiled-$env:RELEASE_TAG-${{ matrix.package_suffix }}"
          New-Item -ItemType Directory -Force -Path "dist/$package" | Out-Null
          Copy-Item "build/Release/mcpi-recompiled.exe" "dist/$package/mcpi-recompiled.exe"
          Copy-Item "README.md", "LICENSE", "NOTICE", "LEGAL.md" "dist/$package/"
          Compress-Archive -Path "dist/$package/*" -DestinationPath "dist/$package.zip" -CompressionLevel Optimal
          Remove-Item -Recurse -Force "dist/$package"

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  arm-build:
    name: Build Linux ${{ matrix.arch }} full client
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ARM64
            docker_platform: linux/arm64
            artifact: release-linux-arm64
            package_suffix: linux-arm64
          - arch: ARM32
            docker_platform: linux/arm/v7
            artifact: release-linux-arm32
            package_suffix: linux-arm32

    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set up QEMU for ARM
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,arm

      - name: Build full ARM client in target userland
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-arm

          docker run --rm \
            --platform "${{ matrix.docker_platform }}" \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD:/workspace" \
            -w /workspace \
            ubuntu:22.04 \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                ca-certificates \
                cmake \
                file \
                pkg-config \
                libasound2-dev \
                libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
                libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
                libdrm-dev libgbm-dev libudev-dev libdbus-1-dev \
                libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev

              cmake -S . -B build-arm \
                -DCMAKE_BUILD_TYPE=Release \
                -DMCPI_BUILD_TESTS=OFF \
                -DMCPI_BUILD_CLIENT=ON \
                -DSDL_X11=ON \
                -DSDL_ALSA=ON \
                -DSDL_KMSDRM=ON \
                -DSDL_LIBUDEV=ON \
                -DSDL_DBUS=ON \
                -DSDL_WAYLAND=OFF \
                -DSDL_PULSEAUDIO=OFF \
                -DSDL_PIPEWIRE=OFF \
                -DSDL_JACK=OFF \
                -DSDL_SNDIO=OFF \
                -DSDL_HIDAPI_LIBUSB=OFF \
                -DSDL_IBUS=OFF \
                -DSDL_LIBURING=OFF \
                -DSDL_RPI=OFF
              cmake --build build-arm --config Release --parallel 2

              test -x "build-arm/mcpi-recompiled"
              file build-arm/mcpi-recompiled
            '

      - name: Verify ARM executable
        shell: bash
        run: |
          set -euo pipefail
          test -x "build-arm/mcpi-recompiled"
          file build-arm/mcpi-recompiled

      - name: Package ARM client
        shell: bash
        run: |
          set -euo pipefail
          package="mcpi-recompiled-${RELEASE_TAG}-${{ matrix.package_suffix }}"
          mkdir -p "dist/${package}"
          cp build-arm/mcpi-recompiled "dist/${package}/mcpi-recompiled"
          cp README.md LICENSE NOTICE LEGAL.md "dist/${package}/"
          chmod +x "dist/${package}/mcpi-recompiled"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          rm -rf "dist/${package}"

      - name: Upload ARM release package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs:
      - prepare
      - build
      - arm-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        shell: bash
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release and tag
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.source_sha }}
          name: mcpi-recompiled ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/mcpi-recompiled-${{ needs.prepare.outputs.tag }}-linux-x86_64.tar.gz
            release-assets/mcpi-recompiled-${{ needs.prepare.outputs.tag }}-windows-x86_64.zip
            release-assets/mcpi-recompiled-${{ needs.prepare.outputs.tag }}-macos-arm64.tar.gz
            release-assets/mcpi-recompiled-${{ needs.prepare.outputs.tag }}-macos-x86_64.tar.gz
            release-assets/mcpi-recompiled-${{ needs.prepare.outputs.tag }}-linux-arm64.tar.gz
            release-assets/mcpi-recompiled-${{ needs.prepare.outputs.tag }}-linux-arm32.tar.gz
            release-assets/SHA256SUMS.txt
