name: Build

on:
  push:
    branches:
      - main
      - "bootstrap/**"
      - "phase1/**"
      - "phase2/**"
  pull_request:

jobs:
  native-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x86-64
          - os: windows-latest
            name: Windows x86-64
          - os: macos-latest
            name: macOS ARM64
          - os: macos-15-intel
            name: macOS x86-64

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install SDL Linux window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev

      - name: Install Python MCPI client
        run: python -m pip install mcpi==1.2.1

      - name: Configure
        run: cmake -S . -B build -DMCPI_BUILD_TESTS=ON -DMCPI_BUILD_CLIENT=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  cross-build:
    name: Linux ${{ matrix.arch }} cross-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ARM64
            packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            toolchain: cmake/toolchains/linux-arm64.cmake
          - arch: ARM32
            packages: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            toolchain: cmake/toolchains/linux-arm32.cmake

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Configure core cross-build
        run: >-
          cmake -S . -B build
          -DMCPI_BUILD_TESTS=OFF
          -DMCPI_BUILD_CLIENT=OFF
          -DCMAKE_TOOLCHAIN_FILE=${{ matrix.toolchain }}

      - name: Build core cross-build
        run: cmake --build build --config Release --parallel
