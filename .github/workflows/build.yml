name: Build

on:
  push:
    branches:
      - main
      - "bootstrap/**"
      - "phase1/**"
      - "phase2/**"
  pull_request:

jobs:
  native-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x86-64
          - os: windows-latest
            name: Windows x86-64
          - os: macos-latest
            name: macOS ARM64
          - os: macos-15-intel
            name: macOS x86-64

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install SDL Linux window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev

      - name: Install Python MCPI client
        run: python -m pip install mcpi==1.2.1

      - name: Configure
        run: cmake -S . -B build -DMCPI_BUILD_TESTS=ON -DMCPI_BUILD_CLIENT=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload deterministic reconstruction frame
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reconstruction-frame-${{ matrix.name }}
          path: build/parity-artifacts/reconstruction.ppm
          if-no-files-found: ignore

  arm-build:
    name: Linux ${{ matrix.arch }} full client
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ARM64
            docker_platform: linux/arm64
          - arch: ARM32
            docker_platform: linux/arm/v7

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU for ARM
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,arm

      - name: Build full ARM client in target userland
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-arm

          docker run --rm \
            --platform "${{ matrix.docker_platform }}" \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD:/workspace" \
            -w /workspace \
            ubuntu:22.04 \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                ca-certificates \
                cmake \
                file \
                pkg-config \
                libasound2-dev \
                libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
                libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
                libdrm-dev libgbm-dev libudev-dev libdbus-1-dev \
                libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev

              cmake -S . -B build-arm \
                -DCMAKE_BUILD_TYPE=Release \
                -DMCPI_BUILD_TESTS=OFF \
                -DMCPI_BUILD_CLIENT=ON \
                -DSDL_X11=ON \
                -DSDL_ALSA=ON \
                -DSDL_KMSDRM=ON \
                -DSDL_LIBUDEV=ON \
                -DSDL_DBUS=ON \
                -DSDL_WAYLAND=OFF \
                -DSDL_PULSEAUDIO=OFF \
                -DSDL_PIPEWIRE=OFF \
                -DSDL_JACK=OFF \
                -DSDL_SNDIO=OFF \
                -DSDL_HIDAPI_LIBUSB=OFF \
                -DSDL_IBUS=OFF \
                -DSDL_LIBURING=OFF \
                -DSDL_RPI=OFF
              cmake --build build-arm --config Release --parallel 2

              test -x "build-arm/mcpi-recompiled"
              file build-arm/mcpi-recompiled
            '

      - name: Verify ARM executable
        shell: bash
        run: |
          set -euo pipefail
          test -x "build-arm/mcpi-recompiled"
          file build-arm/mcpi-recompiled
